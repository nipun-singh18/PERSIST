<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PERSIST — Authentication</title>

    <link rel="stylesheet"
          href="auth.css">

</head>

<body>

    <!-- Background particles -->
    <div id="particles"></div>


    <!-- Main authentication container -->

    <div class="auth-container">

        <div class="auth-box">


            <!-- =================================
                 CREATE ACCOUNT
            ================================== -->

            <div class="form-section signup-section">

                <div class="form-content">

                    <h1>PERSIST</h1>

                    <h2>Create your account</h2>

                    <p class="subtitle">
                        Start building consistency.
                    </p>


                    <form id="signupForm">

                        <div class="input-group">

                            <label for="signupName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="signupName"
                                placeholder="Enter your name"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="signupEmail">
                                Email
                            </label>

                            <input
                                type="email"
                                id="signupEmail"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="signupPassword">
                                Password
                            </label>

                            <input
                                type="password"
                                id="signupPassword"
                                placeholder="Create a password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="main-button">

                            Create Account

                        </button>

                    </form>


                    <p class="switch-text">

                        Already have an account?

                        <button
                            type="button"
                            id="showLogin">

                            Login

                        </button>

                    </p>

                </div>

            </div>



            <!-- =================================
                 LOGIN
            ================================== -->

            <div class="form-section login-section">

                <div class="form-content">

                    <h1>PERSIST</h1>

                    <h2>Welcome back</h2>

                    <p class="subtitle">
                        Keep the streak going.
                    </p>


                    <form id="loginForm">

                        <div class="input-group">

                            <label for="loginEmail">
                                Email
                            </label>

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label for="loginPassword">
                                Password
                            </label>

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="main-button">

                            Login

                        </button>

                    </form>


                    <p class="switch-text">

                        Don't have an account?

                        <button
                            type="button"
                            id="showSignup">

                            Create Account

                        </button>

                    </p>

                </div>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
