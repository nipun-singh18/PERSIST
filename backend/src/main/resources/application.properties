# =========================================
# PERSIST BACKEND CONFIGURATION
# =========================================

spring.application.name=PersistBackend

# -----------------------------------------
# DATABASE CONNECTION
# -----------------------------------------
# Tells Spring Boot where MySQL is running (localhost, default port 3306)
# and which database to connect to (the persist_db we created earlier).

spring.datasource.url=jdbc:mysql://localhost:3306/persist_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------
# JPA / HIBERNATE SETTINGS
# -----------------------------------------
# "update" means: if our Java entity classes define tables that
# don't exist yet in MySQL, Hibernate will create them automatically.
# If they already exist, it updates them to match — it won't delete data.
# (For a learning project this is fine; production apps usually use
# migration tools like Flyway instead of letting Hibernate auto-manage schema.)

spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate generates into your terminal —
# genuinely useful while learning, since you can see exactly what
# CREATE TABLE / INSERT / SELECT statements your Java code produces.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect