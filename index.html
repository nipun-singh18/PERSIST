<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PERSIST</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- Background floating dots -->

    <div id="particles"></div>


    <main class="home-container">

        <section class="hero">

            <h1>
                PERSIST
            </h1>


            <p class="subtitle">
                Personal Consistency & Progress Tracker
            </p>


            <h2 id="animated-text">
                Build consistency. Track progress. Keep going.
            </h2>


            <div class="buttons">


                <!-- =========================
                     GET STARTED
                ========================== -->

                <button
                    id="getStartedButton"
                    type="button"
                    onclick="goToGetStarted()">

                    Get Started

                </button>



                <!-- =========================
                     LOGIN
                ========================== -->

                <button
                    id="loginButton"
                    type="button"
                    onclick="goToLogin()">

                    Login

                </button>


            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
